version: "3.8"

services:
  synapse-lecture-studio:
    build: .
    container_name: synapse-lecture-studio-day24
    ports:
      - "8024:8024"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STREAMLIT_SERVER_PORT=8024
    volumes:
      - ./data:/app/data
    restart: unless-stopped
